<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K2rty — إتمام الطلب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="prefetch" href="index.html">
    <link rel="prefetch" href="cart.html">
</head>
<body>
    <script>
        if (window.location.protocol === 'file:') {
            window.addEventListener('DOMContentLoaded', function() {
                var w = document.createElement('div');
                w.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b91c1c;color:#fff;padding:12px 20px;text-align:center;font-weight:bold;font-size:13px;box-shadow:0 4px 15px rgba(0,0,0,0.3);direction:rtl;';
                w.innerHTML = '⚠️ تنبيه أمان المتصفح: المتصفحات تمنع تشغيل جافاسكريبت الموديلية عند فتح الملف مباشرة (file:///). يرجى تشغيل الموقع بفتح ملف <b>start-website.bat</b> أو تشغيل <b>npm start</b> لفتحه على الرابط المحلي <a href="http://localhost:4173/" style="color:#fef08a;text-decoration:underline;">http://localhost:4173/</a>';
                document.body.prepend(w);
            });
        }
    </script>
    <nav class="navbar">
        <div class="container-custom">
            <div class="nav-content">
                <a href="index.html" class="nav-brand">K2rty</a>
                <div class="nav-links" id="navLinks">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="about.html" class="nav-link">عن K2rty</a>
                    <a href="cart.html" class="nav-link cart-link-mobile">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        السلة
                    </a>
                </div>
                <div class="nav-actions">
                    <button class="nav-toggle" id="navToggle" aria-label="القائمة">
                        <span></span><span></span><span></span>
                    </button>
                    <a href="cart.html" class="nav-link">السلة</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section checkout-page">
        <div class="container-custom" style="max-width:720px;">
            <div id="checkoutContainer">
                <h1 class="section-title" style="text-align:center;">إتمام الطلب</h1>
                <p class="section-lead" style="margin-inline:auto;text-align:center;">خطوة واحدة ونوصّلك طلبك.</p>
                <form id="checkoutForm" onsubmit="return validateReceipt(event)" style="display:flex;flex-direction:column;gap:1.1rem;background:#fff;border:1px solid var(--line);border-radius:24px;padding:1.6rem;">
                    <div class="form-field">
                        <label for="custName">الاسم الكامل *</label>
                        <input type="text" id="custName" required placeholder="الاسم ثلاثي" pattern="[\u0600-\u06FFa-zA-Z\s]{3,50}" title="الاسم يجب أن يكون 3-50 حرف">
                    </div>
                    <div class="form-field">
                        <label for="custPhone">رقم الهاتف (WhatsApp) *</label>
                        <input type="tel" id="custPhone" required placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" title="رقم الهاتف يجب أن يبدأ بـ 01 ويتبعه 10 أرقام">
                    </div>
                    <div class="form-field">
                        <label for="custCity">المدينة / المحافظة *</label>
                        <input type="text" id="custCity" required placeholder="مثال: القاهرة" pattern="[\u0600-\u06FFa-zA-Z\s]{2,30}" title="المدينة يجب أن تكون 2-30 حرف">
                    </div>
                    <div class="form-field">
                        <label for="custAddress">العنوان بالكامل *</label>
                        <input type="text" id="custAddress" required placeholder="الشارع، رقم العمارة، الشقة" pattern="[\u0600-\u06FFa-zA-Z0-9\s\-\,]{10,100}" title="العنوان يجب أن يكون 10-100 حرف">
                    </div>
                    <div class="form-field">
                        <label for="orderNotes">ملاحظات (اختياري)</label>
                        <textarea id="orderNotes" rows="3" placeholder="أي طلبات خاصة؟"></textarea>
                    </div>
                    <div class="form-field">
                        <label>طريقة الدفع *</label>
                        <div class="payment-methods">
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="instapay" required>
                                <span class="payment-label">إنستا باي</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="vodafone_cash" required>
                                <span class="payment-label">فودافون كاش</span>
                            </label>
                        </div>
                    </div>
                    <div class="payment-info" id="paymentInfo" style="display:none;">
                        <p style="margin-bottom:0.5rem;"><strong>رقم المحفظة:</strong> 01098277229</p>
                        <p style="color:var(--muted);font-size:0.9rem;">يرجى التحويل على الرقم أعلاه ثم رفع الإيصال</p>
                    </div>
                    <div class="form-field" id="receiptField" style="display:none;">
                        <label for="receiptImage">صورة الإيصال *</label>
                        <div class="file-upload-wrapper">
                            <label for="receiptImage" class="file-upload-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                <span>اضغط لرفع صورة الإيصال</span>
                            </label>
                            <input type="file" id="receiptImage" accept="image/*">
                            <p class="file-name" id="fileName"></p>
                        </div>
                        <p style="font-size:0.85rem;color:var(--muted);margin-top:0.3rem;">يرجى رفع صورة واضحة للإيصال</p>
                    </div>
                    <p id="receiptError" role="alert" aria-live="assertive" hidden style="color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:0.85rem 1rem;font-weight:600;margin:0;"></p>
                    <div style="background:var(--accent-soft);padding:1.1rem 1.2rem;border-radius:16px;display:flex;justify-content:space-between;font-weight:800;">
                        <span>الإجمالي (بدون شحن)</span>
                        <span id="checkoutTotal">0 جنيه</span>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary btn-lg">تأكيد الطلب</button>
                </form>
            </div>
        </div>
    </section>

    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>الرئيسية</span>
            </a>
            <a href="about.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>عن K2rty</span>
            </a>
            <a href="cart.html" class="bottom-nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span>السلة</span>
            </a>
        </div>
    </nav>

    <div id="toast" class="toast"></div>
    <a href="https://wa.me/201098277229" target="_blank" class="whatsapp-float" title="واتساب">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </a>
    <script>
        function validateReceipt(event) {
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked');
            const receiptInput = document.getElementById('receiptImage');
            const receiptError = document.getElementById('receiptError');
            
            if (paymentMethod && receiptInput.files.length === 0) {
                event.preventDefault();
                event.stopImmediatePropagation();
                receiptError.textContent = 'من فضلك ارفع صورة إيصال الدفع قبل تأكيد الطلب.';
                receiptError.hidden = false;
                receiptError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return false;
            }
            receiptError.hidden = true;
            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navToggle')?.addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('active');
            });

            // Payment method toggle
            const paymentRadios = document.querySelectorAll('input[name="paymentMethod"]');
            const paymentInfo = document.getElementById('paymentInfo');
            const receiptField = document.getElementById('receiptField');
            const receiptInput = document.getElementById('receiptImage');
            const fileName = document.getElementById('fileName');

            paymentRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (radio.checked) {
                        paymentInfo.style.display = 'block';
                        receiptField.style.display = 'flex';
                        document.getElementById('receiptError').hidden = true;
                    }
                });
            });

            // Show file name when selected
            receiptInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    fileName.textContent = e.target.files[0].name;
                    document.getElementById('receiptError').hidden = true;
                }
            });
        });
    </script>
    <script type="module" src="js/checkout.js"></script>
    <script type="module" src="js/cms.js"></script>
</body>
</html>
